name: Refresh current Vencord and OpenAsar release

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: randomfavorites-release-assets
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild when Vencord or OpenAsar changed
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out release automation
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: automation

      - name: Compare the published release with Vencord and OpenAsar
        id: current
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "No stable RandomFavorites release was found."
          }

          $pluginCommit = (git -C automation rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $pluginCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the commit for $tag."
          }

          $vencordCommit = gh api repos/Vendicated/Vencord/commits/main --jq .sha
          if ($LASTEXITCODE -ne 0 -or $vencordCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve the current official Vencord commit."
          }

          $openAsarDigest = gh api repos/GooseMod/OpenAsar/releases/tags/nightly `
            --jq '.assets[] | select(.name == "app.asar") | .digest'
          if ($LASTEXITCODE -ne 0 -or $openAsarDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Could not resolve the current official OpenAsar digest."
          }

          New-Item -ItemType Directory -Force -Path current-manifest | Out-Null
          gh release download $tag `
            --repo $env:GITHUB_REPOSITORY `
            --pattern RandomFavoritesBundle.manifest.json `
            --dir current-manifest `
            --clobber 2>$null

          $needsRefresh = $true
          $manifestPath = "current-manifest/RandomFavoritesBundle.manifest.json"
          if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $manifestPath)) {
            try {
              $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
              $needsRefresh = $manifest.pluginCommit -ne $pluginCommit `
                -or $manifest.vencordCommit -ne $vencordCommit `
                -or $manifest.openAsarDigest -ne $openAsarDigest
            } catch {
              Write-Warning "The published manifest is invalid and will be rebuilt."
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "plugin_commit=$pluginCommit" >> $env:GITHUB_OUTPUT
          "vencord_commit=$vencordCommit" >> $env:GITHUB_OUTPUT
          "openasar_digest=$openAsarDigest" >> $env:GITHUB_OUTPUT
          "needs_refresh=$($needsRefresh.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($needsRefresh) {
            "Official Vencord or OpenAsar changed; rebuilding every current release asset." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "The published release already matches current Vencord and OpenAsar." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Check out the latest RandomFavorites release
        if: steps.current.outputs.needs_refresh == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.current.outputs.tag }}
          path: random-favorites

      - name: Check out the exact current Vencord commit
        if: steps.current.outputs.needs_refresh == 'true'
        uses: actions/checkout@v5
        with:
          repository: Vendicated/Vencord
          ref: ${{ steps.current.outputs.vencord_commit }}
          path: vencord

      - name: Set up Node.js
        if: steps.current.outputs.needs_refresh == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up .NET
        if: steps.current.outputs.needs_refresh == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Enable Vencord's pinned pnpm
        if: steps.current.outputs.needs_refresh == 'true'
        working-directory: vencord
        shell: pwsh
        run: |
          corepack enable
          corepack install

      - name: Add the released RandomFavorites plugin
        if: steps.current.outputs.needs_refresh == 'true'
        shell: pwsh
        run: |
          $destination = "vencord/src/userplugins/randomFavorites"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath random-favorites/index.tsx -Destination $destination
          Copy-Item -LiteralPath "random-favorites/Plugin RandomFavorites" -Destination $destination -Recurse

      - name: Install exact Vencord dependencies
        if: steps.current.outputs.needs_refresh == 'true'
        working-directory: vencord
        run: pnpm install --frozen-lockfile

      - name: Verify compatibility with current Vencord
        if: steps.current.outputs.needs_refresh == 'true'
        working-directory: vencord
        shell: pwsh
        run: |
          pnpm exec tsx --test "src/userplugins/randomFavorites/**/*.test.ts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm eslint src/userplugins/randomFavorites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm testTsc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the refreshed verified bundle
        if: steps.current.outputs.needs_refresh == 'true'
        shell: pwsh
        run: |
          & automation/scripts/Build-ReleaseBundle.ps1 `
            -RandomFavoritesDirectory random-favorites `
            -VencordDirectory vencord `
            -OutputDirectory release-assets `
            -Version "${{ steps.current.outputs.tag }}"

      - name: Rebuild the self-contained installer
        if: steps.current.outputs.needs_refresh == 'true'
        shell: pwsh
        run: |
          $version = ("${{ steps.current.outputs.tag }}").TrimStart("v")
          dotnet publish random-favorites/installer/RandomFavorites.Setup/RandomFavorites.Setup.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=$version `
            -o release-assets/setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath release-assets/setup/RandomFavoritesSetup.exe `
            -Destination release-assets/RandomFavoritesSetup.exe
          $setupPath = Join-Path $PWD "release-assets/RandomFavoritesSetup.exe"
          $setupHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  RandomFavoritesSetup.exe" |
            Set-Content -LiteralPath "$setupPath.sha256" -Encoding ascii -NoNewline

      - name: Run installer safety smoke tests
        if: steps.current.outputs.needs_refresh == 'true'
        run: >-
          dotnet run
          --project random-favorites/installer/RandomFavorites.Setup.SmokeTests/RandomFavorites.Setup.SmokeTests.csproj
          -c Release

      - name: Replace every current release asset
        if: steps.current.outputs.needs_refresh == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.current.outputs.tag }}" `
            release-assets/RandomFavoritesBundle.zip `
            release-assets/RandomFavoritesBundle.zip.sha256 `
            release-assets/RandomFavoritesBundle.manifest.json `
            release-assets/RandomFavoritesSetup.exe `
            release-assets/RandomFavoritesSetup.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          "Release refreshed with Vencord `${{ steps.current.outputs.vencord_commit }}` and OpenAsar `${{ steps.current.outputs.openasar_digest }}`." >> $env:GITHUB_STEP_SUMMARY
